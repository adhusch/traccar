name: Build Docker Image

# Builds the server, the web app from the traccar-web repository of the same
# owner, and a Docker image pushed to ghcr.io/<owner>/traccar.
# Kept separate from release.yml so upstream changes merge without conflicts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 6.16.0
        required: true
      web_ref:
        description: Branch or tag of traccar-web (should match the server version)
        required: true
        default: master
      platforms:
        description: Target platforms
        required: true
        default: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  build-server:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew assemble
      - name: Stage server payload
        shell: bash
        run: |
          mkdir -p out/{conf,lib,schema,templates}
          cp target/tracker-server.jar out/
          cp target/lib/* out/lib/
          cp schema/* out/schema/
          cp -r templates/* out/templates/
          cp setup/traccar.xml out/conf/
      - uses: actions/upload-artifact@v7
        with:
          name: staged-server
          path: out
          retention-days: 1

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/traccar-web
          ref: ${{ inputs.web_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Stage web payload
        shell: bash
        run: |
          mkdir -p out/web out/templates/translations
          cp -r build/* out/web/
          cp -r src/resources/l10n/* out/templates/translations/
      - uses: actions/upload-artifact@v7
        with:
          name: staged-web
          path: out
          retention-days: 1

  package:
    name: Package
    needs: [build-server, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: staged-server
          path: setup/out
      - uses: actions/download-artifact@v8
        with:
          name: staged-web
          path: setup/out
      - name: Build zip
        shell: bash
        working-directory: setup
        run: |
          mkdir -p out/data out/logs
          cp README.txt out/
          (cd out && zip -q -r "../traccar-other-${{ inputs.version }}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: setup/traccar-other-*.zip
          compression-level: 0
          retention-days: 1

  docker:
    name: Docker
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: docker
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: ghcr.io/${{ github.repository_owner }}/traccar
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.alpine
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          push: true
